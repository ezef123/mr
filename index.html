<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МояРеспублика — социальная сеть Республики Жакид</title>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= ЭКРАН ВХОДА ================= -->
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="brand-big">🏛 Моя<span>Республика</span></div>
    <div class="sub">Социальная сеть Республики Жакид</div>

    <div class="tabs-row">
      <button class="tab active" data-authtab="login">Вход</button>
      <button class="tab" data-authtab="register">Регистрация</button>
    </div>

    <form id="loginForm">
      <div class="field">
        <label>Никнейм</label>
        <input id="loginUser" placeholder="zhakid_citizen" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn primary" style="width:100%;margin-top:6px" type="submit">Войти</button>
    </form>

    <form id="registerForm" class="hidden">
      <div class="field">
        <label>Имя и фамилия</label>
        <input id="regName" placeholder="Иван Жакидов" maxlength="40" required>
      </div>
      <div class="field">
        <label>Никнейм</label>
        <input id="regUser" placeholder="ivan_zh" maxlength="20" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="regPass" type="password" placeholder="минимум 4 символа" autocomplete="new-password" required>
      </div>
      <button class="btn primary" style="width:100%;margin-top:6px" type="submit">Создать аккаунт</button>
    </form>

    <div class="error" id="authError"></div>
  </div>
</div>

<!-- ================= ПРИЛОЖЕНИЕ ================= -->
<div class="layout hidden" id="app">

  <!-- ЛЕВАЯ ПАНЕЛЬ -->
  <aside class="sidebar">
    <div class="logo"><span class="ico">🏛</span><span>Моя<b>Республика</b></span></div>
    <nav class="nav">
      <a class="nav-item active" data-action="nav" data-view="feed">🏠 <span>Лента</span></a>
      <a class="nav-item" data-action="nav" data-view="people">👥 <span>Люди</span></a>
      <a class="nav-item" data-action="nav" data-view="notifications">🔔 <span>Уведомления</span></a>
      <a class="nav-item" data-action="nav" data-view="profile">👤 <span>Мой профиль</span></a>
    </nav>
    <div id="userCard"></div>
    <button class="btn ghost" data-action="logout">Выйти</button>
    <div class="side-foot">Республика Жакид · 2026</div>
  </aside>

  <!-- ЦЕНТР -->
  <main class="main">

    <section id="viewFeed" class="view">
      <div class="composer panel">
        <div id="composerAvatar"></div>
        <div class="composer-body">
          <textarea id="postText" placeholder="Что происходит в Республике?" maxlength="1000"></textarea>
          <input id="postImage" placeholder="Ссылка на изображение (необязательно)">
          <div class="composer-actions">
            <span id="postCounter">0 / 1000</span>
            <button class="btn primary" data-action="publish">Опубликовать</button>
          </div>
        </div>
      </div>

      <div class="feed-tabs">
        <button class="tab active" data-action="feed-tab" data-tab="all">Все записи</button>
        <button class="tab" data-action="feed-tab" data-tab="following">Подписки</button>
      </div>

      <div id="feedList"></div>
    </section>

    <section id="viewProfile" class="view hidden"></section>
    <section id="viewPeople" class="view hidden"></section>
    <section id="viewNotifications" class="view hidden"></section>

  </main>

  <!-- ПРАВАЯ ПАНЕЛЬ -->
  <aside class="rightbar">
    <div class="panel">
      <input id="globalSearch" class="search" placeholder="🔍 Поиск людей">
      <div id="searchResults" class="mini-list"></div>
    </div>
    <div class="panel">
      <h3>Кого читать</h3>
      <div id="suggestions" class="mini-list"></div>
    </div>
    <div class="panel small muted" style="text-align:center">
      МояРеспублика — голос каждого гражданина Жакида
    </div>
  </aside>
</div>

<div id="toast"></div>

<!-- Порядок подключения важен! -->
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
</body>
</html>
